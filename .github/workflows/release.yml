name: Publish Foundry module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate release and build ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content module.json -Raw | ConvertFrom-Json
          $tag = "v$($m.version)"
          $repo = "https://github.com/$env:GITHUB_REPOSITORY"
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne $tag) { throw "Run on tag $tag; it must match module.json" }
          if ($m.manifest -ne "$repo/releases/latest/download/module.json") { throw 'Incorrect manifest URL' }
          if ($m.download -ne "$repo/releases/download/$tag/$($m.id)-$($m.version).zip") { throw 'Incorrect download URL' }
          foreach ($file in Get-ChildItem scripts -Filter '*.mjs' -File -Recurse) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid JavaScript: $file" }
          }
          foreach ($language in $m.languages) {
            Get-Content -LiteralPath $language.path -Raw | ConvertFrom-Json | Out-Null
          }
          $runtime = @('module.json', 'README.md', 'LICENSE', 'scripts', 'languages', 'templates')
          foreach ($path in $runtime + @($m.esmodules) + @($m.scripts) + @($m.styles)) {
            if ($path -and !(Test-Path -LiteralPath $path)) { throw "Missing runtime path: $path" }
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath module.json -Destination dist/module.json
          Compress-Archive -LiteralPath $runtime -DestinationPath "dist/$($m.id)-$($m.version).zip" -Force
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content module.json -Raw | ConvertFrom-Json
          $tag = "v$($m.version)"
          gh release create $tag "dist/module.json" "dist/$($m.id)-$($m.version).zip" --repo $env:GITHUB_REPOSITORY --verify-tag --title "$($m.title) $($m.version)" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are not overwritten.' }
