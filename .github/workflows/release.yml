name: Build Foundry release draft

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: module-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate module and build ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -ne 'master') { throw 'Run this workflow on master' }
          $m = Get-Content module.json -Raw | ConvertFrom-Json
          $tag = "v$($m.version)"
          $repo = "https://github.com/$env:GITHUB_REPOSITORY"
          if ($m.manifest -ne "$repo/releases/latest/download/module.json") { throw 'Incorrect manifest URL' }
          if ($m.download -ne "$repo/releases/download/$tag/$($m.id).zip") { throw 'Incorrect download URL' }
          foreach ($file in Get-ChildItem scripts -Filter '*.mjs' -File -Recurse) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Invalid JavaScript: $file" }
          }
          foreach ($language in $m.languages) {
            Get-Content -LiteralPath $language.path -Raw | ConvertFrom-Json | Out-Null
          }
          $runtime = @('module.json', 'README.md', 'LICENSE', 'scripts', 'languages', 'templates')
          foreach ($path in $runtime + @($m.esmodules) + @($m.scripts) + @($m.styles)) {
            if ($path -and !(Test-Path -LiteralPath $path)) { throw "Missing runtime path: $path" }
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath module.json -Destination dist/module.json
          Compress-Archive -LiteralPath $runtime -DestinationPath "dist/$($m.id).zip" -Force
      - name: Create tag and prepare release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content module.json -Raw | ConvertFrom-Json
          $tag = "v$($m.version)"
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read releases' }
          $release = $releases | Where-Object tagName -eq $tag
          if ($release -and !$release.isDraft) {
            $details = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not read release assets' }
            if ($details.assets.Count) {
              Write-Output "$tag is already published; increment module.json version for the next release"
              return
            }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft
            if ($LASTEXITCODE -ne 0) { throw 'Could not recover the empty release as a draft' }
          }
          $tagRef = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read tags' }
          if (!$tagRef) {
            gh api "repos/$env:GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed' }
          }
          if ($release) {
            gh release upload $tag "dist/module.json" "dist/$($m.id).zip" --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag "dist/module.json" "dist/$($m.id).zip" --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "$($m.title) $($m.version)" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Preparing release assets failed' }
